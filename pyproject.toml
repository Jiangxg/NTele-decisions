[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ntele-decision"
version = "0.1.0"
description = "NTele typed decision service backed by SGLang"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "fastapi==0.162.0", "uvicorn==0.54.0", "packaging>=24"]

[project.optional-dependencies]
sglang = ["sglang>=0.5.20"]

[project.scripts]
ntele-decide = "ntele_decision.server:main"

[tool.setuptools.packages.find]
where = ["src"]
